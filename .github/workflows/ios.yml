name: iOS

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    if: "!startsWith(github.head_ref, 'debug') || startsWith(github.head_ref, 'debug-ios')"
    strategy:
      matrix:
        include:
          - name: iOS arm64
            cmakearch: arm64
            cmakesysroot: iphoneos
            outputarch: arm64
          - name: iOS arm64-simulator
            cmakearch: arm64
            cmakesysroot: iphonesimulator
            outputarch: arm64-simulator
          - name: iOS x86_64
            cmakearch: x86_64
            cmakesysroot: iphonesimulator
            outputarch: x86_64-simulator

    runs-on: macos-26

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Install dependencies
      working-directory: ${{github.workspace}}/Build
      run: make depend-mac

    - name: Build TeamTalk library
      working-directory: ${{github.workspace}}/Build
      run: make CMAKE_EXTRA="-G Ninja -DWEBRTC_FETCH_PATH=${{runner.workspace}}/webrtc -DCMAKE_OSX_ARCHITECTURES=${{ matrix.cmakearch }} -DCMAKE_OSX_SYSROOT=${{ matrix.cmakesysroot }} -DTOOLCHAIN_INSTALL_PREFIX=${{runner.workspace}}/toolchain-${{ matrix.outputarch }} -DCMAKE_INSTALL_PREFIX=${{runner.workspace}}/install-${{ matrix.outputarch }}" BUILDDIR=build-${{ matrix.outputarch }} ios-build

    - name: Install TeamTalk SDK
      working-directory: ${{github.workspace}}/Build/build-${{ matrix.outputarch }}
      run: cmake --build . --target install

    - name: Create architecture-specific library
      working-directory: ${{github.workspace}}
      run: >-
        libtool -static -o ${{runner.workspace}}/install-${{ matrix.outputarch }}/Library/TeamTalk_DLL/libTeamTalk5-${{ matrix.outputarch }}.a
        Library/TeamTalk_DLL/${{ matrix.outputarch }}/libTeamTalk5.a
        ${{runner.workspace}}/toolchain-${{ matrix.outputarch }}/speex/lib/libspeex.a
        ${{runner.workspace}}/toolchain-${{ matrix.outputarch }}/speexdsp/lib/libspeexdsp.a
        ${{runner.workspace}}/toolchain-${{ matrix.outputarch }}/opus/lib/libopus.a
        ${{runner.workspace}}/toolchain-${{ matrix.outputarch }}/libvpx/lib/libvpx.a
        ${{runner.workspace}}/toolchain-${{ matrix.outputarch }}/ace/lib/libACE.a
        ${{runner.workspace}}/toolchain-${{ matrix.outputarch }}/ace/lib/libACE_SSL.a
        ${{runner.workspace}}/toolchain-${{ matrix.outputarch }}/ace/lib/libACE_INet.a
        ${{runner.workspace}}/toolchain-${{ matrix.outputarch }}/ace/lib/libACE_INet_SSL.a
        ${{runner.workspace}}/toolchain-${{ matrix.outputarch }}/openssl/lib/libcrypto.a
        ${{runner.workspace}}/toolchain-${{ matrix.outputarch }}/openssl/lib/libssl.a

    - name: Upload architecture artifact
      uses: actions/upload-artifact@v7
      with:
        name: teamtalksdk-ios-${{ matrix.outputarch }}
        path: ${{runner.workspace}}/install-${{ matrix.outputarch }}

  lipo:
    needs: build
    permissions:
      security-events: write
      packages: read

    runs-on: macos-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: swift
        build-mode: manual

    - name: Check for source changes
      uses: dorny/paths-filter@v4
      id: changes
      with:
        filters: |
          src:
            - 'Library/TeamTalk_DLL/**'
            - 'Client/iTeamTalk/**'

    - name: Download ARM64 artifact
      uses: actions/download-artifact@v8
      with:
        name: teamtalksdk-ios-arm64

    - name: Download x86_64 simulator artifact
      uses: actions/download-artifact@v8
      with:
        name: teamtalksdk-ios-x86_64-simulator

    - name: Download arm64 simulator artifact
      uses: actions/download-artifact@v8
      with:
        name: teamtalksdk-ios-arm64-simulator

    - name: Create universal binary
      working-directory: ${{github.workspace}}
      run: >-
        lipo Library/TeamTalk_DLL/libTeamTalk5-arm64.a
        Library/TeamTalk_DLL/libTeamTalk5-x86_64-simulator.a
        -create -output ${{github.workspace}}/Library/TeamTalk_DLL/libTeamTalk5.a

    - name: Create simulator binary
      working-directory: ${{github.workspace}}
      run: >-
        lipo Library/TeamTalk_DLL/libTeamTalk5-arm64-simulator.a
        Library/TeamTalk_DLL/libTeamTalk5-x86_64-simulator.a
        -create -output ${{github.workspace}}/Library/TeamTalk_DLL/libTeamTalk5-simulator.a

    - name: Upload universal library artifact
      uses: actions/upload-artifact@v7
      with:
        name: teamtalksdk-ios-universal
        path: ${{github.workspace}}

    - name: Build iTeamTalk client
      if: steps.changes.outputs.src == 'true'
      working-directory: ${{github.workspace}}
      run: >-
        xcodebuild -project Client/iTeamTalk/iTeamTalk.xcodeproj
        CODE_SIGN_IDENTITY=-
        AD_HOC_CODE_SIGNING_ALLOWED=YES
        CODE_SIGN_STYLE=Automatic
        COMPILER_INDEX_STORE_ENABLE=NO

    - name: Perform CodeQL Analysis
      if: steps.changes.outputs.src == 'true'
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:swift"
